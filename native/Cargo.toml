[package]
name = "inbox-prover"
version = "0.0.0"
edition = "2021"
[dependencies]
tlsn = { git = "https://github.com/tlsnotary/tlsn.git", tag = "v0.1.0-alpha.15", features = ["mozilla-certs"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
tokio-util = { version = "0.7", features = ["compat"] }
serde_json = "1"
eyre = "0.6"

async-tungstenite = { version = "0.29", features = ["tokio-runtime", "tokio-rustls-webpki-roots"] }
ws_stream_tungstenite = "0.15"
futures-util = { version = "0.3", features = ["io"] }

base64 = "0.22"
hex = "0.4"
bincode = "1.3"
serde = "1"

[dev-dependencies]
tlsn-server-fixture-certs = { git = "https://github.com/tlsnotary/tlsn.git", tag = "v0.1.0-alpha.15" }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
